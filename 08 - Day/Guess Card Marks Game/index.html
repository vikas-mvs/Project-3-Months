<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Card Marks Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Guess Card Marks Game</h1>
            <p id="score-point">Score : 0 (Target : 25)</p>
            <button onclick="playGame()" id="actionBtn">Start Game</button>
            <p id="coins">Coins : 100 &#129689;</p>
            <p>Game Entry Fee: 10 Coins</p>
            <p>Only 4 cards shown at a time!</p>
            <h2 class="result"></h2>
        </div>
        <div class="cards">
            <div class="card" id="card1" onclick="changeColor(this)"></div>
            <div class="card" id="card2" onclick="changeColor(this)"></div>
            <div class="card" id="card3" onclick="changeColor(this)"></div>
            <div class="card" id="card4" onclick="changeColor(this)"></div>
            <div class="card" id="card5" onclick="changeColor(this)"></div>
            <div class="card" id="card6" onclick="changeColor(this)"></div>
            <div class="card" id="card7" onclick="changeColor(this)"></div>
            <div class="card" id="card8" onclick="changeColor(this)"></div>
            <div class="card" id="card9" onclick="changeColor(this)"></div>
            <div class="card" id="card10" onclick="changeColor(this)"></div>
            <div class="card" id="card11" onclick="changeColor(this)"></div>
            <div class="card" id="card12" onclick="changeColor(this)"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
