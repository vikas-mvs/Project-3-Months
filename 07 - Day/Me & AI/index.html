<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section class="todo-card">
            <div class="header">
                <h1>To-Do List</h1>
            </div>

            <form id="todo-form" class="todo-form">
                <input id="todo-input" type="text" placeholder="Add a new task" autocomplete="off">
                <button type="submit">Add</button>
            </form>

            <div class="filters">
                <button class="filter active" type="button" data-filter="all">All</button>
                <button class="filter" type="button" data-filter="active">Active</button>
                <button class="filter" type="button" data-filter="completed">Done</button>
            </div>

            <ul id="todo-list" class="todo-list"></ul>

            <div class="footer">
                <span id="task-count">0 tasks left</span>
                <button id="clear-completed" type="button">Clear Done</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
