<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>YouPlayer</title>
</head>

<body>
    <header>
        <div class="left-side">
            <i class="fa-solid fa-bars"></i>
            <i class="fa-brands fa-youtube" id="brand"></i>
            <h1>YouPlayer</h1>
        </div>
        <div class="center-side">
            <input id="linktext" placeholder="Enter your Link.." type="text">
            <button id="playbtn" onclick="change()"><i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="right-side">
            <i class="fa-solid fa-download" id="downloadbtn" onclick="downloadVideo()" style="margin-right: 5px;"></i>
            <i class="fa-solid fa-share-nodes" id="sharebtn" onclick="share()"></i>
        </div>
    </header>
    <div id="main">
        <iframe id="frame" src="https://www.youtube.com/embed/kTXrmIIB1sU" allowfullscreen autoplay></iframe>
    </div>

    <script src="app.js"></script>
</body>

</html>
