<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Random Dogs Image</title>
</head>
<body>
    <div class="container">
        <h1>Random Dogs Image</h1>
        <img src="" id="dogimg">
        <br>
        <button onclick="nextDog()">Next</button>
        <button onclick="downloadDog()" id="down">Download</button>
    </div>
    <script>
        async function nextDog() {
            const img = document.getElementById("dogimg");
            try {
                const res = await fetch("https://dog.ceo/api/breeds/image/random");
                const data = await res.json();
                img.src = data.message;
            } catch {
                img.alt = "Error loading dog";
            }
        }

    async function downloadDog() {
        const img = document.getElementById("dogimg");
        const res = await fetch(img.src);
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "dog.jpg";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
    }
    window.onload = function () {
        nextDog();
    };
    </script>
</body>
</html>
